<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<div class="profile-page">

    <!-- HEADER PERFIL -->
    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar" id="profileAvatar">👤</div>

            <div>
                <h2 id="profileName">Carregando...</h2>
                <p id="profileEmail"></p>
            </div>

        </div>

        <div class="profile-actions">
            <a href="index.html">🏠 Voltar para loja</a>
            <button onclick="logoutCustomer()">Sair</button>
            <button onclick="openProfileEdit()" class="profile-btn secondary">
    📋 Meus dados
</button>
        </div>

    </div>


    <!-- PEDIDOS -->
    <div class="profile-section">

        <h3>🛒 Meus pedidos</h3>
        <div id="ordersList">
            <p>Nenhum pedido ainda</p>
        </div>

    </div>

    <!-- CARRINHO -->
    <div class="profile-section">

        <h3>🧺 Carrinho atual</h3>
        <div id="cartList">
            <p>Carrinho vazio</p>
        </div>

    </div>

</div>

<script src="script.js"></script>

<script>
firebase.auth().onAuthStateChanged(user => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    document.getElementById("profileName").innerText =
        (user.displayName || "Cliente").split(" ")[0];

    document.getElementById("profileEmail").innerText =
        user.email;

    if (user.photoURL) {
        document.getElementById("profileAvatar").innerHTML =
            `<img src="${user.photoURL}" style="width:100%;height:100%;border-radius:50%">`;
    }

    // carregar carrinho
    loadProfileCart(user.uid);
    loadProfileOrders(user.uid);

    // 👇 AQUI ENTRA O PASSO 4
    firebase.database()
        .ref("users/" + user.uid)
        .once("value")
        .then(snapshot => {

            const data = snapshot.val();

            document.getElementById("profilePhone").value = data?.phone || "";
            document.getElementById("profileBirthdate").value = data?.birthdate || "";
            document.getElementById("profileAddress").value = data?.address || "";
            document.getElementById("profileGender").value = data?.gender || "";
        });

});
</script>
<div id="profileModal" class="profile-modal">

    <div class="profile-modal-content">

        <h3>Editar meus dados</h3>

        <input type="text" id="profilePhone" placeholder="Telefone">
        <input type="date" id="profileBirthdate">
        <input type="text" id="profileAddress" placeholder="Endereço">

        <select id="profileGender">
            <option value="">Sexo</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>

        <div class="profile-modal-actions">

            <button onclick="saveProfileData()" class="profile-btn danger">
                Salvar
            </button>

            <button onclick="closeProfileEdit()" class="profile-btn secondary">
                Cancelar
            </button>

        </div>

    </div>

</div>
</body>
</html>
